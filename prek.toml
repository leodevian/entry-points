[[repos]]
repo = "builtin"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "f26bd20264b5e50a1b1755cc2585b3464ca5c3b9"  # frozen: v1.10.0
hooks = [
  { id = "tombi-format", args = ["--offline"] },
  { id = "tombi-lint", args = ["--offline"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "c0f278f1254ccc8fb09676bcdb8d847e7db493e5"  # frozen: v0.17.4
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "b0cff962ee693b9e612c097d22e71e0cba127447"  # frozen: v0.3.2
hooks = [
  { id = "rumdl-check", args = ["--fix"] },
  { id = "rumdl-fmt" },
]
