[project]
name = "entry-points-test"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Léo Bernard", email = "leodevian.gh@gmail.com" }]
dependencies = [
  "typer>=0.27.3",
]
import-names = ["entry_points.test"]
import-namespaces = ["entry_points"]

[project.scripts]
entry-points-test = "entry_points.test.cli:app"

[project.entry-points."entrypoints.apps"]
test = "entry_points.test.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "entry_points.test"
